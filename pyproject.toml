[project]
name = "medqa-finetune"
version = "0.1.0"
description = "LoRA vs QLoRA fine-tuning comparison on medical Q&A (GPT-2 / TinyLlama)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.21",
    "accelerate>=0.34",
    "peft>=0.12",
    "trl>=0.10",
    "huggingface_hub>=0.24",
    "numpy>=1.26",
]

[project.optional-dependencies]
# bitsandbytes is CUDA-only — no macOS wheel exists. Colab installs this extra.
gpu = ["bitsandbytes>=0.43"]
app = ["gradio>=4.44"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "nbstripout>=0.7",
    "ipykernel>=6.29",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks are drivers, not library code: `import gc, torch` and `a(); b()` are
# idiomatic in a cell and unhelpful to fight. `notebooks/original/` is a frozen
# reference copy and must not be reformatted at all. nbstripout guards these.
#
# Markdown is excluded because `ruff format` rewrites Python inside fenced blocks.
# ROADMAP.md *quotes the original buggy notebook code* as evidence; reformatting a
# quotation silently edits the record it exists to preserve.
extend-exclude = ["notebooks", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# network tests are opt-in: CI has no HF token, and a suite that downloads
# model weights is a suite nobody runs. Enable with `-m network`.
addopts = "-q -m 'not network'"
markers = ["network: requires the HuggingFace Hub"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medqa"]
