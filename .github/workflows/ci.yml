name: ci

on:
  # Every pull request, not just those targeting main. Phases land as a stack
  # (phase-4 -> phase-3 -> main), and a `branches: [main]` filter would skip CI
  # on every PR in the stack except the last one — exactly the PRs where a
  # regression is cheapest to catch.
  pull_request:
  push:
    branches: [main]

# a new push to the same PR cancels the previous run
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: requirements-ci.txt

      - name: Set up Python
        run: uv python install 3.11

      # requirements.txt is resolved on macOS for Fayaz's laptop and pins a torch
      # that drags the whole CUDA stack onto Linux. requirements-ci.txt is the
      # linux/cpu resolution (torch==2.13.0+cpu, no nvidia-* wheels).
      #
      # CPU only. Never train in CI: there is no GPU, and it would burn the
      # minutes budget for a result no one reads. The GPU path is Colab's job.
      # --torch-backend=cpu is needed at install time as well as at compile time:
      # the lockfile records `torch==2.13.0+cpu` but not the index it came from,
      # and that build does not exist on PyPI. Without the flag, resolution fails
      # with "no version of torch==2.13.0+cpu".
      - name: Install dependencies
        run: |
          uv venv
          uv pip install --torch-backend=cpu -r requirements-ci.txt
          uv pip install --no-deps -e .

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      # The suite is offline by design — `-m 'not network'` comes from
      # pyproject.toml, so no HF token is needed and runs stay near a minute.
      - name: Test
        run: uv run pytest
