[project]
name = "medqa-finetune"
version = "0.1.0"
description = "LoRA vs QLoRA fine-tuning comparison on medical Q&A (GPT-2 / TinyLlama)"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.4",
    "transformers>=4.44",
    "datasets>=2.21",
    "accelerate>=0.34",
    "peft>=0.12",
    "trl>=0.10",
    "huggingface_hub>=0.24",
    "numpy>=1.26",
]

[project.optional-dependencies]
# bitsandbytes is CUDA-only — no macOS wheel exists. Colab installs this extra.
gpu = ["bitsandbytes>=0.43"]
app = ["gradio>=4.44"]
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "pre-commit>=3.8",
    "nbstripout>=0.7",
    "ipykernel>=6.29",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medqa"]
